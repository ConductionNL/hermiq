platforms:
  - web

categories:
  - workflow-management
  - task-management

developmentStatus: development

dependsOn:
  open:
    - name: Nextcloud
      versionMin: "32"
      versionMax: "35"
    - name: OpenRegister
      versionMin: "0.2.17-unstable.14"

