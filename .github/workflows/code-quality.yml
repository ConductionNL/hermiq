name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, master, development, beta]
  workflow_dispatch:

jobs:
  quality:
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: hermiq
      php-version: "8.3"
      php-test-versions: '["8.3", "8.4"]'
      nextcloud-test-refs: '["stable31", "stable32", "stable33"]'
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      enable-phpunit: true
      enable-newman: true
      # `development`, not `main`. Hermiq's development branch is analysed against
      # the OpenRegister branch it actually targets: interfaces Hermiq implements
      # (IShareableConfigType, IFlowNode, IFlowResolver) land on OR development
      # first, and an implemented-but-unresolvable interface is a NON-ignorable
      # PHPStan error — phpstan.neon's `#implements unknown interface
      # OCA\OpenRegister\#` pattern cannot suppress it, because reflection fails
      # before ignoreErrors applies. Pinning `main` therefore fails the build for
      # code that is correct against its real dependency. Matches the convention
      # already used by opencatalogi, openconnector and pipelinq.
      additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"development"}]'
      enable-sbom: true
