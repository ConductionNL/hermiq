name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, master, development, beta]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Permissions for the called quality pipeline. A reusable workflow can never
# hold MORE than its caller grants, so this block is a CEILING, not a request:
# any job in ConductionNL/.github's quality.yml that declares a permission
# missing here makes the whole run fail at STARTUP.
#
# 🔴 That failure mode is why this comment is long. A startup failure produces
# ZERO jobs, so `gh pr checks` lists nothing for Code Quality and the PR reads
# as green — a dead gate and a passing gate are indistinguishable from the
# outside. hermiq had NO permissions block at all, and when the shared
# quality.yml started requiring one (2026-08-03) every Code Quality run on
# development began aborting at startup with zero jobs, silently.
#
# `contents: write` and `actions: write` are needed because three jobs in the
# shared pipeline COMMIT BACK to the repository rather than only reading it:
#   - `update-baseline`    — writes the coverage baseline
#   - `features-extract`   — writes features.json
#   - `journeydoc-capture` — writes captured journey docs (also `actions: write`)
# hermiq additionally runs `enable-sbom: true`, which commits the SBOM.
#
# Before narrowing any line here, disable the jobs that need it FIRST, and
# confirm the run still produces jobs — not merely that it stopped failing.
permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write


jobs:
  quality:
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: hermiq
      php-version: "8.3"
      php-test-versions: '["8.3", "8.4"]'
      nextcloud-test-refs: '["stable31", "stable32", "stable33"]'
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      enable-phpunit: true
      enable-newman: true
      # hermiq's development branch co-develops with OpenRegister's development
      # branch (the fleet ships dev->beta->main together): ObjectService's
      # deleteObject(register:, schema:) / find(_render:) / saveObject(silent:,
      # uploadedFiles:, currentUser:) surface that hermiq calls does not exist on
      # OR main yet, so testing this branch against OR main fails on version
      # skew, not on hermiq bugs.
      #
      # The same skew is unrecoverable for interfaces hermiq *implements*
      # (IShareableConfigType, IFlowNode, IFlowResolver): an implemented-but-
      # unresolvable interface is a NON-ignorable PHPStan error — reflection fails
      # before ignoreErrors applies, so phpstan.neon's existing
      # `#implements unknown interface OCA\OpenRegister\#` pattern cannot suppress
      # it and only a matching OR ref makes the build correct.
      additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"development"}]'
      # enable-playwright stays OFF, and that is a finding rather than an
      # oversight. Turning it on (2026-07-30) proved the job itself works — it
      # builds the frontend, enables the app, and runs — but the suite is NOT
      # CI-green: 43 of 64 specs failed across 11 spec files, and the first
      # failing assertion is the app shell itself, not anything app-specific.
      #
      # Two things have to change before this can be flipped:
      #   1. The playwright job checks out `nextcloud-test-refs[0]`, which is
      #      stable31 here, while hermiq's frontend is developed and verified
      #      against NC 34. Every UI spec fails on the shell; the API-only ones
      #      pass, which is exactly the 21/43 split observed.
      #   2. The remaining specs need triage for seed/fixture assumptions that
      #      hold on a dev instance and not on a fresh one.
      #
      # Until then the guards in tests/e2e are run by hand
      # (`npx playwright test --project=chromium`) — which is how the row-click
      # and graph-editor regressions in this branch were caught.
      enable-sbom: true
