# hermiq speech sidecar — ONE container for both speech-to-text and text-to-speech.
#
# ⚠️ THERE IS DELIBERATELY NO DOCKERFILE HERE, AND ONLY ONE SERVICE.
#
# An earlier draft planned a bespoke Python sidecar; a second draft ran Whisper
# and Kokoro as two containers. Both are replaced by Speaches, which serves
# faster-whisper (STT) and Kokoro/Piper (TTS) behind ONE OpenAI-compatible API:
# `/v1/audio/transcriptions` and `/v1/audio/speech`. It describes itself as
# "Ollama, but for TTS/STT models", which is the right mental model — including
# on-demand model load/unload with a configurable TTL.
#
# What we would have hand-rolled is exactly what this already is, minus the
# maintenance: we would have owned a torch/ONNX image and rebuilt it on every CVE.
# Hermiq's side stays a TaskProcessing provider making an HTTP call.
#
# ⚠️ WHY NOT FOLD THIS INTO `hermiq-llm-runner` — the answer is not "tidiness":
#
#   - That image is **Node 22**. These are Python ML workloads. Consolidating
#     means carrying a second language runtime plus torch in an image whose whole
#     point is a small, auditable CLI transport.
#   - Its hardened posture is **no default route, egress only through a proxy that
#     asks Hermiq's PDP per connection** (see llm-runner/deploy/docker-compose.yml).
#     A model server must reach HuggingFace to fetch weights on first use — so
#     folding them together either punches a hole in that jail or breaks model
#     loading. The postures are incompatible, not merely different.
#   - Lifecycles differ: a CLI turn is burst work; a speech model wants GB of
#     weights resident. One OOM in transcription would take the LLM transport
#     down with it.
#   - A torch CVE would force a rebuild-and-redeploy of the LLM transport, and
#     vice versa. Coupling them makes both harder to patch.
#
# Ollama itself cannot host these either: it has no audio input path, and neither
# Whisper nor Kokoro is a GGUF LLM.
#
# ⚠️ NOT VENDOR-OFFICIAL, because no vendor-official image exists: OpenAI ships
# the Whisper *model*, hexgrad ships Kokoro *weights*; neither ships a service.
# That is exactly why the digest pin below is not optional — same PA3 note
# `llm-runner/Dockerfile` carries: a floating tag lets a poisoned upstream
# rebuild propagate on the next `docker compose pull`.
#
# SPDX-License-Identifier: EUPL-1.2
# Copyright 2026 Conduction B.V.

services:
  hermiq-speech:
    image: ghcr.io/speaches-ai/speaches:latest-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    container_name: hermiq-speech
    restart: unless-stopped
    environment:
      # Keep a loaded model resident; a cold load on every call dominates latency.
      # Speaches unloads after this TTL — -1 disables unloading.
      - WHISPER__TTL=-1
      - ENABLE_UI=false
    volumes:
      # Persist weights so a restart is not a multi-GB re-download, and so an
      # air-gapped instance keeps working once primed.
      - hermiq-speech-models:/home/ubuntu/.cache/huggingface
    ports:
      - '127.0.0.1:8000:8000'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # ⚠️ NOT curl — these images do not reliably ship it, and a curl-based check
      # reports `unhealthy` forever while the service is provably fine. A check
      # that can never pass is worse than none: it trains everyone to ignore the
      # column.
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 10s
      # The first call for a given model lazily fetches its weights (~1.6 GB for
      # whisper turbo), so the container is legitimately unhealthy for a while on
      # a cold volume.
      start_period: 15m
      retries: 5

volumes:
  # ⚠️ USE A FRESH VOLUME, never one an earlier speech container wrote to.
  # Speaches runs as `ubuntu` (uid 1000). The single-purpose Whisper/Kokoro
  # images run as root and cache under a different path, so a reused volume
  # leaves root-owned directories that Speaches cannot write — and the failure
  # surfaces as a bare `500 Internal Server Error` on model install, with the
  # actual `PermissionError` only visible in the container log.
  hermiq-speech-models:

# ---------------------------------------------------------------------------
# PRIMING — required, and different from the single-purpose images.
#
# Speaches does NOT lazily download a model on first use; it 404s with
# "Model '<id>' is not installed locally". Install both before first use:
#
#   curl -X POST http://127.0.0.1:8000/v1/models/deepdml/faster-whisper-large-v3-turbo-ct2
#   curl -X POST http://127.0.0.1:8000/v1/models/speaches-ai/Kokoro-82M-v1.0-ONNX
#
# `GET /v1/registry?task=text-to-speech` lists valid ids — worth consulting,
# since a wrong id fails the same way a missing one does.
#
# Verified end to end on this compose: Kokoro synthesised "One sidecar now
# serves both directions." and Whisper large-v3-turbo transcribed it back word
# for word, both inside this one container, with no audio leaving the instance.
# ---------------------------------------------------------------------------
