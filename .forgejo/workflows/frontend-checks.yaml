# Frontend + spec quality gate — eslint, stylelint, and the manifest/registry/
# spec validators (node-based) on every PR.
#
# Runner/container: `runs-on: docker` (Codeberg's shared Forgejo runner) + the
# ci-node image, matching the other passing .forgejo workflows in the fleet.

name: frontend-checks

on:
  pull_request:
    branches:
      - development
      - main
      - beta

jobs:
  frontend-checks:
    name: Frontend + spec checks (Hermiq)
    runs-on: docker
    container:
      image: code.forgejo.org/oci/ci-node:20
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install npm deps
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: ESLint
        run: npm run lint

      - name: Stylelint
        run: npm run stylelint

      - name: Manifest + registry + spec validators
        run: npm run check:specs
