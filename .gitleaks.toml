# gitleaks configuration: the default rules, plus allowlists for findings
# that are not secrets. Each allowlist names the exact files and only the
# rules that fire there, so anything else in those files is still reported.

[extend]
useDefault = true

[[allowlists]]
description = "Documentation examples: the default admin:admin login of the local development and demo containers."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)docs/Installation/demo\-environment\.md$''',
]

[[allowlists]]
description = "Unit test fixtures: made-up API keys, an AWS-shaped example key, a sample JWT and a planted secret that the redaction and guardrail tests must catch, plus a form id (a UUID)."
targetRules = ["aws-access-token", "generic-api-key", "jwt"]
paths = [
  '''(^|/)tests/Unit/Flow/HermiqWorkloadNodeTest\.php$''',
  '''(^|/)tests/Unit/Service/DeliveryServiceTest\.php$''',
  '''(^|/)tests/Unit/Service/Engine/EngineStreamedOutputGuardrailTest\.php$''',
  '''(^|/)tests/Unit/Service/RedactionServiceTest\.php$''',
  '''(^|/)tests/Unit/Service/ScheduleServiceTest\.php$''',
]
